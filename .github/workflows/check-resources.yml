name: Check resource repositories
on:
  push:
    branches: [main]
    paths:
      - recipe.yaml
      - scripts/check_resources.py
      - .github/workflows/check-resources.yml
  pull_request:
    paths:
      - recipe.yaml
      - scripts/check_resources.py
      - .github/workflows/check-resources.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Check public repository and branch availability
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/check_resources.py
