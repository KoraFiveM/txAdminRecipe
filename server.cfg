# =============================================================================
# KORA FRAMEWORK | OFFICIAL TXADMIN SERVER CONFIGURATION
# =============================================================================
# https://docs.fivem.net/docs/server-manual/server-commands/
# Generated by txAdmin. Review Cfx Portal listing settings and local server permissions.
# Do not commit a deployed server.cfg containing actual credentials.

# -----------------------------------------------------------------------------
# 1. NETWORKING & SERVER CAPACITY
# -----------------------------------------------------------------------------
# txAdmin supplies the TCP/UDP listener addresses and ports.
# Docs: https://github.com/citizenfx/txAdmin/blob/master/docs/recipe.md
{{serverEndpoints}}
# Maximum simultaneous players; txAdmin supplies the chosen limit.
# Docs: https://docs.fivem.net/docs/server-manual/server-commands/#sv_maxclients-newvalue
sv_maxclients {{maxClients}}
# Cfx.re server license; txAdmin supplies it securely.
# Docs: https://docs.fivem.net/docs/server-manual/server-commands/#sv_licensekey-key
sv_licenseKey "{{svLicense}}"
# OneSync is configured by the txAdmin recipe ($onesync: on).
# Configure your server's ports/firewall at the hosting provider.

# -----------------------------------------------------------------------------
# 2. SERVER LISTING | CONFIGURE IN CFX PORTAL
# -----------------------------------------------------------------------------
# [!] Server listing configuration has moved to Cfx Portal.
# Configure the server name, project name/description, locale, tags,
# connecting/detail banners and server icon in your server's portal settings.
# Portal: https://portal.cfx.re/servers
# Do NOT configure these listing ConVars here:
# sv_projectName, sv_projectDesc, sv_hostname, locale, tags,
# banner_connecting, banner_detail, load_server_icon
#
# -----------------------------------------------------------------------------
# 3. GAME & PLATFORM
# -----------------------------------------------------------------------------
# Pins the GTA V game build used by joining clients.
# Docs: https://docs.fivem.net/docs/server-manual/server-commands/#sv_enforcegamebuild-build
sv_enforceGameBuild 3751
# Only enable Steam API integration if required by a resource.
# set steam_webApiKey "YOUR_STEAM_WEB_API_KEY"
# System chat is available to resources that use it.
# Enables the system chat mode requested by this server setup.
# Docs: https://docs.fivem.net/docs/server-manual/server-commands/
set resources_useSystemChat true
# Controls join messages in compatible chat resources; verify support in your chat resource.
# Docs: https://docs.fivem.net/docs/scripting-reference/resource-manifest/resource-manifest/
set chat_showJoins false
# Controls leave messages in compatible chat resources; verify support in your chat resource.
# Docs: https://docs.fivem.net/docs/scripting-reference/resource-manifest/resource-manifest/
set chat_showQuits false

# -----------------------------------------------------------------------------
# 4. DATABASE
# -----------------------------------------------------------------------------
# txAdmin supplies this value from its database setup.
# Never paste a real database password into a public GitHub repository.
# Database connection string populated from txAdmin setup.
set mysql_connection_string "{{dbConnectionString}}"
# Database creation: kora.sql (executed during txAdmin deployment).
# Table creation/migrations: kora_sql (when the server starts).

# -----------------------------------------------------------------------------
# 5. LOCALES & KORA COMPATIBILITY
# -----------------------------------------------------------------------------
# QBCore-compatible resource locale; resource-specific setting.
# Docs: https://github.com/qbcore-framework/qb-core
setr qb_locale "en"
# Add Kora-specific convars here only when documented by their resources.
# Keep the framework's default configuration in the relevant resource files.

# -----------------------------------------------------------------------------
# 6. DEFAULT FIVE M RESOURCES
# -----------------------------------------------------------------------------
# These must exist in your downloaded resources.
# Starts FiveM map manager resource.
# Docs: https://docs.fivem.net/docs/server-manual/server-commands/
ensure mapmanager
# Uncomment only if supplied and required by your chosen resource pack.
# ensure spawnmanager
# ensure sessionmanager
# ensure hardcap

# -----------------------------------------------------------------------------
# 7. KORA STARTUP ORDER
# -----------------------------------------------------------------------------
# Core dependencies must start before Kora gameplay resources.
# Starts Kora shared library before dependent resources.
# Docs: https://github.com/KoraFiveM/kora_lib
ensure kora_lib
# Starts Kora SQL initialization and schema management.
# Docs: https://github.com/KoraFiveM/kora_sql
ensure kora_sql
# Starts Kora inventory.
# Docs: https://github.com/KoraFiveM/kora_inventory
ensure kora_inventory
# Starts the main Kora framework.
# Docs: https://github.com/KoraFiveM/kora_core
ensure kora_core

# Compatibility resources, started after kora_sql and kora_core and before gameplay resources.
# Starts the oxmysql placeholder (forwards to kora_sql; never run real oxmysql).
# Docs: https://github.com/KoraFiveM/compat
ensure oxmysql
# Starts the mysql-async placeholder (forwards to kora_sql; never run real mysql-async).
ensure mysql-async
# Starts the qb-core include wrapper (needs kora_core).
ensure qb-core
# Starts anything else in [compat] (PolyZone). Already-started resources are unaffected.
ensure [compat]

# Gameplay resources and independent integrations.
# Starts all resources in the [kora] resource category.
# Docs: https://docs.fivem.net/docs/server-manual/server-commands/
ensure [kora]
# Starts all resources in the [standalone] category.
# Docs: https://docs.fivem.net/docs/server-manual/server-commands/
ensure [standalone]
# Starts the default map resources category.
# Docs: https://docs.fivem.net/docs/server-manual/server-commands/
ensure [default-maps]

# -----------------------------------------------------------------------------
# 8. ACCESS CONTROL
# -----------------------------------------------------------------------------
# Admin roles, QBCore compatibility permissions, and Kora permissions.
# Loads Kora/QBCore ACE access rules from a separate config.
# Docs: https://docs.fivem.net/docs/server-manual/server-commands/
exec permissions.cfg
# txAdmin inserts the initial server owner's principals here.
# txAdmin inserts the master administrator principal assignments.
# Docs: https://github.com/citizenfx/txAdmin/blob/master/docs/recipe.md
{{addPrincipalsMaster}}

# -----------------------------------------------------------------------------

# =============================================================================
# 9. OPTIONAL SECURITY CONTROLS
# =============================================================================
# Disallow ScriptHook-based plugins. Does not block all client-side cheats.
# Docs: https://docs.fivem.net/docs/server-manual/setting-up-a-server-vanilla/
sv_scriptHookAllowed 0

# Optional request-control filtering; review Kora gameplay compatibility first.
# Docs: https://docs.fivem.net/docs/developers/server-security/
#sv_filterRequestControl 2

# Optional entity lockdown; may affect resources that create client-side entities.
# Docs: https://docs.fivem.net/docs/server-manual/server-commands/#sv_entitylockdown-mode
#sv_entityLockdown relaxed

# =============================================================================
# 10. OPTIONAL VOICE SETTINGS (FIVEM LEGACY)
# =============================================================================
# Native audio permits filters/submixes in compatible legacy voice resources.
# Not supported as a legacy convar on FiveM for GTAV Enhanced.
# Docs: https://docs.fivem.net/docs/scripting-manual/voice/
#setr voice_useNativeAudio true

# Restricts legacy voice reception to a player's sending range.
# Not supported as a legacy convar on FiveM for GTAV Enhanced.
# Docs: https://docs.fivem.net/docs/scripting-manual/voice/
#setr voice_useSendingRangeOnly true

# 11. OPTIONAL OPERATIONS & SECURITY
# -----------------------------------------------------------------------------
# Use txAdmin for scheduled restarts, monitoring, backups and admin management.
# Keep artifacts/resources updated and restrict access to the txAdmin panel.
# Avoid adding blanket "add_ace builtin.everyone command allow" permissions.
# Do not expose database credentials, Discord tokens, or API keys in GitHub.
# Add resource-specific keys only when those resources are installed.
# FiveManage token (uncomment and configure privately if needed):
# Optional Kora-specific FiveManage token. Keep your actual token private.
# Docs: https://docs.fivemanage.com/
#set kora_fivemanage_token "YOUR_FIVEMANAGE_TOKEN"
# =============================================================================
