# Kora Framework and QBCore compatibility permissions
add_ace group.admin command allow
add_ace group.admin qbcore:command allow
add_ace group.admin qbcorecommand allow
add_ace group.admin command.zoneeditor allow
add_ace group.admin qbcore.admin allow
add_ace group.admin qblib.config.edit allow
add_ace group.admin kora:command allow
add_ace group.admin koracommand allow
add_ace group.admin kora.admin allow
add_ace group.admin kora_lib.config.edit allow

# Resource permissions
add_ace resource.kora_core command allow

# Administrators
add_ace qbcore.god command allow
add_ace kora.god command allow
add_principal qbcore.god group.admin
add_principal qbcore.god qbcore.admin
add_principal qbcore.admin qbcore.mod
add_principal kora.god group.admin
add_principal kora.god qbcore.admin
add_principal kora.admin qbcore.mod
